# The Site Configuration
webmaster_verifications:
  google: 6kUOV_peTFkNwFWIvyz8FV5ppChX6rwpJwO_YkxR3Fc
# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage › http://www.lingoes.net/en/translator/langcode.htm
lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: # ← ADD THIS (e.g. America/Chicago)

# jekyll-seo-tag settings › https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
# ↓ --------------------------

title: Austin Mundy # the main title

tagline: Cloud Security Engineer | Azure & DevSecOps # ← update as you like

description: >-
  Cloud security blog covering Azure, Terraform, DevSecOps, 
  and hands-on homelab projects by Austin Mundy.

# Fill in the protocol & hostname for your site.
url: "https://letitgo90.github.io"

github:
  username: LetItGo90

twitter:
  username: # ← ADD THIS or leave blank

social:
  name: Austin Mundy
  email: # ← ADD THIS
  fediverse_handle: # leave blank
  links:
    # First element = copyright owner link
    - https://github.com/LetItGo90
    - https://www.linkedin.com/in/austin-mundy-236868121/
    # - https://twitter.com/username  ← uncomment & add if you have one

# Site Verification Settings
webmaster_verifications:
  google: # ← ADD THIS after Google Search Console setup
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id: # fill in your Google Analytics ID
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

# Color scheme
theme_mode: dark # matches your current dark theme

# CDN
cdn:

# Sidebar avatar
avatar: # ← ADD THIS (e.g. /assets/img/avatar.jpg)

# SEO social preview image
social_preview_image:

# TOC in posts
toc: true

comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Self-hosted static assets
assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# The base URL of your site
baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

